# dsh-web-ui-jx bundle patch: 将姜晓插件的双半区行插入 web profile roster。
# 作为 profile bundle 层应用（package.json 的 dsh.bundle.patch 字段指向本文件）；
# 安装方式：`dsh plugin --profile web add link:<repo>/dsh-web-ui-jx`。
#
# 单行同时挂载 host/client 双半区：
#   - host 半区（exports "."）在宿主进程运行：注册 /api/dsh-jx/* 素材路由 +
#     导入 API + KV 元数据（工单 02/07 起填充）。
#   - browser 半区（exports "./client"，由 package.json 的 dsh.client 声明，
#     经 /plugins/dsh-web-ui-jx/client.js 服务）在 web GUI 加载：注入管理 UI +
#     角色浮层 + 设置卡 + 侧边栏入口（工单 03/04/08/10 起填充）。
- insert:
    - id: dsh-jx
      name: "dsh-web-ui-jx"
